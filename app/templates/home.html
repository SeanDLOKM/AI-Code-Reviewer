{% extends 'base.html' %}
{% block content %}
<section class="container">
    <p>Welcome to the GitHub Repository Reviewer, powered by Google Gemini's API</p>
    <form method="POST" id="repo-form">
        {{ form.hidden_tag() }}
        <div class="repo-form">{{ form.repo_url() }} {{ form.submit(id="repo-submit") }}</div>
    </form>
</section>
{% endblock %}
